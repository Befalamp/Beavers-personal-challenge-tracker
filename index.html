<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#129c93">
<title>Beaver Personal Challenge Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --bg:#eef7f6;
    --ink:#153a38;
    --teal:#129c93;
    --teal-dark:#0d716a;
    --coral:#4a6fa5;
    --coral-dark:#33517d;
    --danger:#c0392b;
    --card-shadow:rgba(21,58,56,0.10);
    --line:#e4ede5;
    font-family:'Nunito',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  #beaver-app{
    background:var(--bg);
    padding:22px 16px 40px;
    min-height:100%;
    color:var(--ink);
  }

  .header{ text-align:center; margin-bottom:18px; max-width:900px; margin-left:auto; margin-right:auto; }
  .header .kicker{ margin-bottom:6px; }
  .header .kicker img{ height:44px; width:auto; display:block; margin:0 auto; }
  .header h1{
    font-family:'Baloo 2','Nunito',sans-serif;
    font-weight:800;
    font-size:1.55rem;
    color:var(--ink);
    margin:0 0 4px;
  }
  .header p{ margin:0; font-size:0.85rem; color:#5c7a77; font-weight:700; }

  .add-beaver-row{
    max-width:900px; margin:0 auto 16px; display:flex; gap:8px;
  }
  .add-beaver-row input{
    flex:1; border:2px solid #cfe4e1; border-radius:12px;
    padding:11px 14px; font-size:0.95rem; font-family:inherit; font-weight:700;
    color:var(--ink); background:#fff;
  }
  .add-beaver-row input:focus{ outline:none; border-color:var(--teal); }
  .add-beaver-row button{
    background:var(--teal); color:#fff; border:none; border-radius:12px;
    padding:0 20px; font-weight:800; font-size:1.4rem; cursor:pointer; line-height:1;
    box-shadow:0 3px 0 var(--teal-dark);
  }
  .add-beaver-row button:active{ transform:translateY(2px); box-shadow:none; }

  .beaver-list{
    max-width:900px; margin:0 auto; display:grid;
    grid-template-columns:1fr; gap:10px; align-items:start;
  }
  @media (min-width: 820px){
    .beaver-list{ grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); }
  }

  .beaver-card{
    background:#fff; border-radius:16px; box-shadow:0 3px 0 var(--card-shadow); overflow:hidden;
    border-left:5px solid var(--accent, var(--teal));
  }
  .beaver-card-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; cursor:pointer; gap:8px;
  }
  .beaver-name-wrap{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .beaver-name{
    font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:1.08rem;
    color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .beaver-name.done::after{ content:" 🎉"; }
  .progress-dots{ display:flex; gap:3px; flex-shrink:0; }
  .progress-dots span{
    width:7px; height:7px; border-radius:50%; background:#e4ede5; display:block;
  }
  .progress-dots span.filled-c1{ background:var(--teal); }
  .progress-dots span.filled-c2{ background:var(--coral); }
  .chevron{
    font-size:0.85rem; color:#b9c9c6; transition:transform 0.15s ease; flex-shrink:0;
  }
  .beaver-card.open .chevron{ transform:rotate(90deg); }

  .remove-zone{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .icon-btn{
    background:none; border:none; font-size:1.05rem; cursor:pointer; padding:4px 6px; line-height:1;
  }
  .icon-btn.remove{ color:#d99a86; }
  .icon-btn.confirm{ color:#fff; background:var(--danger); border-radius:8px; font-weight:800; font-size:0.8rem; padding:6px 10px; }
  .icon-btn.cancel{ color:#7a8c89; font-weight:700; font-size:0.8rem; }

  .beaver-body{
    display:none; padding:2px 14px 16px;
  }
  .beaver-card.open .beaver-body{ display:block; }

  .task-name-input{
    width:100%; border:none; border-bottom:2px solid #eee; background:transparent;
    font-size:0.86rem; font-weight:700; color:var(--ink); padding:6px 2px;
    font-family:inherit; margin-bottom:6px;
  }
  .task-name-input.c1:focus{ outline:none; border-bottom-color:var(--teal); }
  .task-name-input.c2:focus{ outline:none; border-bottom-color:var(--coral); }

  .challenge-block{ margin-top:12px; }
  .challenge-block:first-child{ margin-top:6px; }
  .week-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .week-tick{
    aspect-ratio:1; border-radius:12px; border:2px solid var(--line); background:#f8faf7;
    display:flex; align-items:center; justify-content:center; font-size:1.25rem; font-weight:800;
    color:transparent; cursor:pointer; user-select:none;
    transition:transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    position:relative;
  }
  .week-tick .wk-num{
    position:absolute; top:2px; left:5px; font-size:0.55rem; font-weight:700; color:#b7c4bf;
  }
  .week-tick.ticked.c1{ background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 2px 0 var(--teal-dark); }
  .week-tick.ticked.c2{ background:var(--coral); border-color:var(--coral); color:#fff; box-shadow:0 2px 0 var(--coral-dark); }
  .week-tick.ticked .wk-num{ color:rgba(255,255,255,0.75); }
  .week-tick:active{ transform:scale(0.88); }

  .empty-state{
    text-align:center; color:#5c7a77; font-weight:700; padding:34px 10px; font-size:0.95rem;
    max-width:900px; margin:0 auto;
  }
  .footer-note{
    text-align:center; font-size:0.75rem; color:#a3b8b5; margin-top:22px; font-weight:700;
    max-width:900px; margin-left:auto; margin-right:auto;
  }
  .footer-logo{ display:block; margin:18px auto 8px; height:22px; width:auto; opacity:0.85; }

  .hidden{ display:none !important; }
  .login-wrap{
    max-width:360px; margin:28px auto 0; background:#fff; border-radius:16px;
    padding:22px 20px; box-shadow:0 3px 0 var(--card-shadow);
  }
  .login-wrap h2{
    font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:1.2rem;
    margin:0 0 4px; color:var(--ink);
  }
  .login-wrap p{ margin:0 0 14px; font-size:0.85rem; color:#5c7a77; font-weight:700; }
  .login-wrap input{
    width:100%; border:2px solid #cfe4e1; border-radius:12px; padding:11px 14px;
    font-size:1rem; font-family:inherit; font-weight:700; color:var(--ink);
    background:#fff; margin-bottom:10px;
  }
  .login-wrap input:focus{ outline:none; border-color:var(--teal); }
  .login-wrap button.primary{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:12px;
    padding:12px; font-weight:800; font-size:1rem; font-family:inherit; cursor:pointer;
    box-shadow:0 3px 0 var(--teal-dark);
  }
  .login-wrap button.primary:active{ transform:translateY(2px); box-shadow:none; }
  .login-wrap button.primary:disabled{ opacity:0.6; }
  .login-error{ color:var(--danger); font-size:0.85rem; font-weight:700; min-height:1.2em; margin:2px 0 10px; }
  .login-error.ok{ color:var(--teal-dark); }
  .link-btn{
    background:none; border:none; color:var(--teal-dark); font-weight:700; font-family:inherit;
    font-size:0.85rem; cursor:pointer; padding:6px 0; text-decoration:underline;
  }
  .signout-row{ text-align:center; margin-top:4px; }
</style>

<div id="beaver-app">
  <div class="header">
    <div class="kicker"><img src="beavers-logo.png" alt="Beavers"></div>
    <h1>Personal Challenge Tracker</h1>
    <p>Tap a name to open it, tap a week once it's done</p>
  </div>

  <div id="login-panel" class="login-wrap hidden">
    <h2>Leader sign in</h2>
    <p>Use the email and password you were given.</p>
    <input id="login-email" type="email" inputmode="email" autocomplete="username" placeholder="Email" />
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" />
    <div id="login-error" class="login-error"></div>
    <button id="login-btn" class="primary">Sign in</button>
    <div class="signout-row"><button id="reset-btn" class="link-btn" type="button">Forgot password?</button></div>
  </div>

  <div id="tracker-body" class="hidden">
    <div class="add-beaver-row">
      <input id="new-beaver-name" placeholder="Add a Beaver's name" />
      <button id="add-beaver-btn">+</button>
    </div>

    <div id="beaver-list" class="beaver-list"></div>
  </div>
  <img class="footer-logo" src="ellesmere-logo.png" alt="Ellesmere Town Scouts">
  <div class="footer-note" id="status-note">Shared with signed-in leaders only</div>
  <div class="signout-row"><button id="signout-btn" class="link-btn hidden" type="button">Sign out</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU-GMF6U0yHLI1O2rJxU8HjV2QeheivbI",
  authDomain: "beaver-personal-challenge.firebaseapp.com",
  projectId: "beaver-personal-challenge",
  appId: "1:581303881401:web:1843300f5876e7ad955568"
};
const auth = getAuth(initializeApp(firebaseConfig));

(function(){
  const DB_URL = 'https://beaver-personal-challenge-default-rtdb.europe-west1.firebasedatabase.app';
  const DATA_PATH = DB_URL + '/beaverChallengeData.json';
  const ACCENTS = ['#129c93','#5b7fd1','#d64545','#6fb04f','#3fa7d6','#2f4858','#8b6fd1','#7f8c8d'];
  let state = { beavers: [] };
  let openId = null;
  let confirmingRemoveId = null;
  const DEFAULT_MSG = 'Shared with signed-in leaders only';
  let statusMsg = DEFAULT_MSG;
  let loaded = false;       // true only after a successful read; saves are refused until then
  let pendingSaves = 0;
  let pollTimer = null;

  const listEl = document.getElementById('beaver-list');
  const addInput = document.getElementById('new-beaver-name');
  const addBtn = document.getElementById('add-beaver-btn');

  function uid(){ return 'b' + Math.random().toString(36).slice(2,9); }
  function accentFor(index){ return ACCENTS[index % ACCENTS.length]; }

  async function authedUrl(){
    const user = auth.currentUser;
    if(!user) throw new Error('not signed in');
    const token = await user.getIdToken();   // refreshed automatically when it expires
    return DATA_PATH + '?auth=' + encodeURIComponent(token);
  }

  async function save(){
    if(!loaded){
      // A failed read must never be followed by a write, or an empty list would overwrite saved data.
      statusMsg = "Not saved — the saved data hasn't loaded yet, check your connection";
      render();
      return;
    }
    pendingSaves++;
    try{
      const res = await fetch(await authedUrl(), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      if(statusMsg !== DEFAULT_MSG){
        statusMsg = DEFAULT_MSG;
        render();
      }
    }catch(e){
      console.error('save failed', e);
      statusMsg = "Couldn't save just now — check your connection and try again";
      render();
    }finally{
      pendingSaves--;
    }
  }

  async function load(){
    try{
      const res = await fetch(await authedUrl());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(data) state = Object.assign({ beavers: [] }, data);
      loaded = true;
      statusMsg = DEFAULT_MSG;
    }catch(e){
      console.error('load failed', e);
      statusMsg = /HTTP (401|403)/.test(String(e.message))
        ? "This account isn't allowed to open the data — ask Beth to add you"
        : "Couldn't load saved data — check your connection";
    }
    render();
  }

  function render(){
    const noteEl = document.getElementById('status-note');
    if(noteEl) noteEl.textContent = statusMsg;

    if(state.beavers.length === 0){
      listEl.innerHTML = '<div class="empty-state">No Beavers added yet 🦫<br>Add one above to get started</div>';
      return;
    }
    listEl.innerHTML = '';
    state.beavers.forEach((b, idx) => {
      const c1Done = b.c1.filter(Boolean).length;
      const c2Done = b.c2.filter(Boolean).length;
      const allDone = c1Done === 4 && c2Done === 4;
      const isOpen = openId === b.id;
      const isConfirming = confirmingRemoveId === b.id;

      const card = document.createElement('div');
      card.className = 'beaver-card' + (isOpen ? ' open' : '');
      card.style.setProperty('--accent', accentFor(idx));

      const top = document.createElement('div');
      top.className = 'beaver-card-top';
      top.onclick = () => {
        confirmingRemoveId = null;
        openId = isOpen ? null : b.id;
        render();
      };

      const nameWrap = document.createElement('div');
      nameWrap.className = 'beaver-name-wrap';
      const nameEl = document.createElement('div');
      nameEl.className = 'beaver-name' + (allDone ? ' done' : '');
      nameEl.textContent = b.name;
      nameWrap.appendChild(nameEl);

      const dots = document.createElement('div');
      dots.className = 'progress-dots';
      for(let i=0;i<4;i++){
        const d = document.createElement('span');
        if(i < c1Done) d.className = 'filled-c1';
        dots.appendChild(d);
      }
      for(let i=0;i<4;i++){
        const d = document.createElement('span');
        if(i < c2Done) d.className = 'filled-c2';
        dots.appendChild(d);
      }
      nameWrap.appendChild(dots);
      top.appendChild(nameWrap);

      if(!isConfirming){
        const chevron = document.createElement('div');
        chevron.className = 'chevron';
        chevron.textContent = '▸';
        top.appendChild(chevron);
      }

      const removeZone = document.createElement('div');
      removeZone.className = 'remove-zone';

      if(isConfirming){
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'icon-btn cancel';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = (e) => { e.stopPropagation(); confirmingRemoveId = null; render(); };
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'icon-btn confirm';
        confirmBtn.textContent = 'Remove';
        confirmBtn.onclick = (e) => {
          e.stopPropagation();
          state.beavers = state.beavers.filter(x => x.id !== b.id);
          confirmingRemoveId = null;
          save(); render();
        };
        removeZone.appendChild(cancelBtn);
        removeZone.appendChild(confirmBtn);
      } else {
        const removeBtn = document.createElement('button');
        removeBtn.className = 'icon-btn remove';
        removeBtn.textContent = '✕';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          confirmingRemoveId = b.id;
          render();
        };
        removeZone.appendChild(removeBtn);
      }
      top.appendChild(removeZone);

      card.appendChild(top);

      const body = document.createElement('div');
      body.className = 'beaver-body';
      body.appendChild(buildChallengeBlock(b, 'c1'));
      body.appendChild(buildChallengeBlock(b, 'c2'));
      card.appendChild(body);

      listEl.appendChild(card);
    });
  }

  function buildChallengeBlock(beaver, key){
    const block = document.createElement('div');
    block.className = 'challenge-block';

    const input = document.createElement('input');
    input.className = 'task-name-input ' + key;
    input.placeholder = key === 'c1' ? 'Challenge 1 name' : 'Challenge 2 name';
    input.value = beaver[key + 'Name'] || '';
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('change', () => { beaver[key + 'Name'] = input.value; save(); });
    block.appendChild(input);

    const row = document.createElement('div');
    row.className = 'week-row';
    for(let i=0;i<4;i++){
      const cell = document.createElement('div');
      const ticked = beaver[key][i];
      cell.className = 'week-tick' + (ticked ? ' ticked ' + key : '');
      cell.innerHTML = '<span class="wk-num">Wk' + (i+1) + '</span>' + (ticked ? '✓' : '');
      cell.onclick = (e) => {
        e.stopPropagation();
        beaver[key][i] = !beaver[key][i];
        save(); render();
      };
      row.appendChild(cell);
    }
    block.appendChild(row);
    return block;
  }

  function addBeaver(){
    const name = addInput.value.trim();
    if(!name) return;
    if(!loaded){
      statusMsg = "Wait for the saved data to load before adding anyone";
      render();
      return;
    }
    const b ={ id: uid(), name, c1Name:'', c2Name:'', c1:[false,false,false,false], c2:[false,false,false,false] };
    state.beavers.push(b);
    openId = b.id;
    addInput.value = '';
    save(); render();
  }
  addBtn.onclick = addBeaver;
  addInput.addEventListener('keydown', e => { if(e.key === 'Enter') addBeaver(); });

  // ---- sign-in ----
  const loginPanel = document.getElementById('login-panel');
  const trackerBody = document.getElementById('tracker-body');
  const signoutBtn = document.getElementById('signout-btn');
  const emailInput = document.getElementById('login-email');
  const pwInput = document.getElementById('login-password');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const resetBtn = document.getElementById('reset-btn');

  function setLoginMsg(text, ok){
    loginError.textContent = text;
    loginError.className = 'login-error' + (ok ? ' ok' : '');
  }

  function friendlyAuthError(e){
    switch(e && e.code){
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found': return "That email or password isn't right";
      case 'auth/invalid-email': return "That doesn't look like an email address";
      case 'auth/too-many-requests': return "Too many tries — wait a few minutes and try again";
      case 'auth/network-request-failed': return "No connection — check your internet";
      case 'auth/operation-not-allowed': return "Email sign-in isn't switched on in Firebase yet";
      default: return "Couldn't sign in — try again";
    }
  }

  async function doLogin(){
    const email = emailInput.value.trim();
    const pw = pwInput.value;
    if(!email || !pw){ setLoginMsg('Enter your email and password'); return; }
    loginBtn.disabled = true;
    setLoginMsg('');
    try{
      await signInWithEmailAndPassword(auth, email, pw);
      pwInput.value = '';
    }catch(e){
      console.error('sign in failed', e);
      setLoginMsg(friendlyAuthError(e));
    }
    loginBtn.disabled = false;
  }

  async function doReset(){
    const email = emailInput.value.trim();
    if(!email){ setLoginMsg('Type your email above first, then tap Forgot password'); return; }
    try{
      await sendPasswordResetEmail(auth, email);
      setLoginMsg('If that account exists, a reset email is on its way', true);
    }catch(e){
      console.error('reset failed', e);
      setLoginMsg(friendlyAuthError(e));
    }
  }

  loginBtn.onclick = doLogin;
  resetBtn.onclick = doReset;
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  signoutBtn.onclick = () => { signOut(auth); };

  function poll(){
    if(pendingSaves > 0) return;
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    load();
  }

  onAuthStateChanged(auth, (user) => {
    const signedIn = !!user;
    loginPanel.classList.toggle('hidden', signedIn);
    trackerBody.classList.toggle('hidden', !signedIn);
    signoutBtn.classList.toggle('hidden', !signedIn);
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    loaded = false;
    openId = null;
    confirmingRemoveId = null;
    if(signedIn){
      statusMsg = DEFAULT_MSG;
      load();
      pollTimer = setInterval(poll, 4000);
    }else{
      state = { beavers: [] };   // don't keep anyone's data in memory once signed out
      listEl.innerHTML = '';
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e => console.error('SW registration failed', e));
  }
})();
</script>
